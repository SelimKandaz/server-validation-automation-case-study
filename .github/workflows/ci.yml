name: Script Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  script-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check shell scripts
        run: |
          find scripts -name "*.sh" -print -exec bash -n {} \;
      - name: Compile Python scripts
        run: python -m compileall scripts
